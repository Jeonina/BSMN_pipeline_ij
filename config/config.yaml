# =============================================================================
# BSMN Somatic Variant Calling Pipeline - Configuration (Production)
# =============================================================================
# For chr22 validation runs use: config/config.validation.yaml
#   snakemake --configfile config/config.validation.yaml ...

# -- Sample information -------------------------------------------------------
samples: config/samples.tsv
# Two supported schemas (auto-detected by column names):
#   bam mode   : sample_id<TAB>bam    — pre-aligned BAM or CRAM; runs calling/
#                filtering directly without re-mapping. See config/samples.bam.example.tsv
#                and config/config.chr20.yaml for an end-to-end chr20 example.
#   fastq mode : sample_id<TAB>readgroup<TAB>fq1<TAB>fq2 — raw FASTQ; runs the
#                full FASTQ -> CRAM mapping pipeline (rules/mapping.smk).

# -- Pipeline stage to run ----------------------------------------------------
# Options: "mapping", "calling", "filtering", "all"
stage: "mapping"

# -- Scratch location ---------------------------------------------------------
# Where per-job transient scratch (sort temp, Picard TMP, GATK java.io.tmpdir) goes.
# Leave null to keep it under results/scratch (follows the output filesystem). When
# results/ live on NFS, set this to a FAST LOCAL path so mapping is not bottlenecked
# on NFS random I/O — e.g. a path on an SSD-backed local/Ceph disk. It is per-job
# deleted (+ reclaimed by online `discard`), so it never accumulates: outputs, not
# scratch, are what must stay off a capacity-bound disk.
scratch_dir: null

# -- Reference genome ---------------------------------------------------------
ref:
  build: "hg38"                  # informational only — not read by the rules
  fasta: "resources/hg38/Homo_sapiens_assembly38.fasta"
  dict:  "resources/hg38/Homo_sapiens_assembly38.dict"

# -- Known sites (for BQSR) ---------------------------------------------------
known_sites:
  dbsnp:   "resources/hg38/Homo_sapiens_assembly38.dbsnp138.vcf.gz"
  mills:   "resources/hg38/Mills_and_1000G_gold_standard.indels.hg38.vcf.gz"
  # SNP high-confidence set used as an additional BQSR known-sites VCF.
  indels:  "resources/hg38/1000G_phase1.snps.high_confidence.hg38.vcf.gz"

# -- Mapping parameters -------------------------------------------------------
# bwa_threads sets threads PER bwa_mem_sort job, which controls how many
# readgroups map in parallel:  concurrency = (--cores) // bwa_threads.
# bwa scales well to ~24-32 threads, so a moderate value parallelizes far
# better than one huge job (e.g. --cores 168, bwa_threads 24 -> 7 readgroups
# at once). Watch RAM: ~12-16 GB per concurrent job.
# sort_threads / sort_memory / markdup_memory are auto-resolved by auto_params.
mapping:
  # 'auto' defers to the host-tuner (scripts/auto_params.py -> resolved_params.yaml);
  # pin an int to override. See the concurrency note above for what the value means.
  bwa_threads: auto              # per-job threads -> parallelism = --cores // this
  sort_threads: 4
  sort_memory: "4GB"             # sambamba sort buffer per bwa_mem_sort job
  markdup_memory: "16G"
  output_format: "cram"          # cram | bam

  # MarkDuplicates engine:
  #   picard — single-threaded, the BSMN-lineage path validated against HG002.
  #   spark  — GATK MarkDuplicatesSpark in local mode; same duplicate-flagging
  #            algorithm across markdup_threads cores, at the cost of extra RAM
  #            and scratch space under results/mapping/{sample}/tmp.
  # 'auto' = picard (single-threaded, but pipelines across samples on a many-core
  # cohort and needs no fast scratch). Spark is an explicit OPT-IN: pin
  # markdup_engine: "spark" only on hosts with fast LOCAL scratch — it ran ~2x
  # slower than picard when its shuffle spilled to NFS (see auto-tuner notes).
  markdup_engine: auto
  markdup_threads: auto          # 'auto' = min(16, cores); only used when spark is pinned

# -- Mutect2 calling parameters -----------------------------------------------
calling:
  caller: "mutect2"              # informational only — Mutect2 is hardcoded in rules

  # Chromosomes for scatter-gather (one Mutect2 job per entry)
  chromosomes:
    - chr1
    - chr2
    - chr3
    - chr4
    - chr5
    - chr6
    - chr7
    - chr8
    - chr9
    - chr10
    - chr11
    - chr12
    - chr13
    - chr14
    - chr15
    - chr16
    - chr17
    - chr18
    - chr19
    - chr20
    - chr21
    - chr22
    - chrX
    - chrY

  germline_resource: "resources/hg38/af-only-gnomad.hg38.vcf.gz"
  contamination_resource: "resources/hg38/small_exac_common_3.hg38.vcf.gz"

  # Panel of Normals (optional — set use: true and provide vcf path)
  pon:
    use: false
    vcf: ""                      # path to pre-built PON VCF

  # Cores per Mutect2 scatter job, forwarded as --native-pair-hmm-threads.
  # PairHMM is Mutect2's only parallel section and its scaling flattens past
  # ~4 threads; spend surplus cores on more concurrent chromosomes instead.
  mutect2_threads: auto          # 'auto' = 4 (GATK default, PairHMM-only); pin an int to override

  # Extra GATK flags (appended verbatim)
  mutect2_extra: ""
  filter_extra: "--min-reads-per-strand 1"

# -- Filtering parameters -----------------------------------------------------
# Default cascade order (see workflow/rules/filtering.smk):
#   1 accessibility(mask_1kg) -> 2 germline(gnomad) -> 3 vaf -> 4 cnvnator ->
#   5 mosaicforecast -> 6 pon_mask.   (mayo is the unwired E-step alternative.)
filtering:
  # Step 2: germline filter (remove gnomAD AF > 0.001 known germline)
  gnomad:
    snps: "resources/hg38/gnomAD.hg38.AFover0.001.snps.txt.gz"
    # af_threshold documents the cut already baked into the snps file above;
    # germline_filter uses set membership only (value is not re-applied).
    af_threshold: 0.001

  # Step 3: VAF filter
  vaf:
    min_alt_count: 5
    p_binom_threshold: 1.0e-6
    min_mapq: 20
    min_baseq: 20

  # Step 4: CNVnator filter (BSMN D-step: drop CNV-region calls, CN >= threshold)
  #   ROOT built per sample by rule cnvnator_root (binsize 100). v0.4.1 reads
  #   the reference via -fasta, so no per-chromosome split is required.
  cnvnator:
    binsize: 100
    cn_threshold: 2.5      # drop candidate if genotyped copy number >= this
    window: 1000           # +/-bp window genotyped around each candidate

  # BSMN E-step ALTERNATIVE to MosaicForecast — retained but UNWIRED by default
  # (to enable, repoint mosaicforecast_filter.input.txt at mayo_filtered.txt).
  mayo:
    max_repeat_n: 4         # reject if repeat_n >= this
    max_repeat_length: 10   # reject if repeat_length >= this
    min_strand_p: 0.05      # keep if p_poisson OR p_fisher >= this
    min_mapq: 20
    min_baseq: 20

  # Step 5: MosaicForecast filter (BSMN E-step, DEFAULT: RF mosaic prediction)
  #   Scripts + k24.umap.wg.bw ship inside the mosaicforecast image; the RF
  #   model is cloned to resources/MosaicForecast/. Pick the model by depth
  #   (250x for ~300x HG002; 200x for the brain WGS study).
  mosaicforecast:
    model: "resources/MosaicForecast/models_trained/250xRFmodel_addRMSK_Refine.rds"
    mode: "Refine"
    min_prob: 0.0           # 0 = all mosaic calls; 0.6 = high-confidence only
    timeout: 300            # per-variant feature-extraction timeout (s)
    retries: 5
    workers: 4              # concurrent variants (parallel RLF processes); capped at --cores

  # Step 6: PON mask
  pon_mask:
    fasta: "resources/hg38/PON.q20q20.05.5.fa"

  # Step 1: accessibility — 1KG strict mask (mappability)
  mask_1kg: "resources/hg38/1KG.20160622.strict_mask.hg38_GRCh38.bed"

# -- SLURM resource defaults --------------------------------------------------
# NOTE: not read by the workflow — per-rule resources come from the rules and the
# SLURM profile (workflow/profiles/slurm/config.yaml). Kept for reference only.
resources:
  default:
    mem_mb: 8000
    threads: 1
    runtime: 120                 # minutes
