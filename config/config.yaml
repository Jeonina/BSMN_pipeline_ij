# =============================================================================
# BSMN Somatic Variant Calling Pipeline - Configuration (Production)
# =============================================================================
# For chr22 validation runs use: config/config.validation.yaml
#   snakemake --configfile config/config.validation.yaml ...

# -- Sample information -------------------------------------------------------
samples: config/samples.tsv
# TSV format: sample_id<TAB>bam (for calling/filtering)
#         or: sample_id<TAB>fq1<TAB>fq2<TAB>platform<TAB>readgroup (for mapping)

# -- Pipeline stage to run ----------------------------------------------------
# Options: "mapping", "calling", "filtering", "all"
stage: "mapping"

# -- Reference genome ---------------------------------------------------------
ref:
  build: "hg38"
  fasta: "resources/hg38/Homo_sapiens_assembly38.fasta"
  dict:  "resources/hg38/Homo_sapiens_assembly38.dict"

# -- Known sites (for BQSR) ---------------------------------------------------
known_sites:
  dbsnp:   "resources/hg38/Homo_sapiens_assembly38.dbsnp138.vcf.gz"
  mills:   "resources/hg38/Mills_and_1000G_gold_standard.indels.hg38.vcf.gz"
  indels:  "resources/hg38/1000G_phase1.snps.high_confidence.hg38.vcf.gz"

# -- Mapping parameters -------------------------------------------------------
mapping:
  bwa_threads: 16
  sort_threads: 4
  sort_memory: "4GB"             # per-thread memory for sambamba sort
  markdup_memory: "16G"
  output_format: "cram"          # cram | bam

# -- Mutect2 calling parameters -----------------------------------------------
calling:
  caller: "mutect2"              # mutect2 (haplotypecaller planned)

  # Chromosomes for scatter-gather (one Mutect2 job per entry)
  chromosomes:
    - chr1
    - chr2
    - chr3
    - chr4
    - chr5
    - chr6
    - chr7
    - chr8
    - chr9
    - chr10
    - chr11
    - chr12
    - chr13
    - chr14
    - chr15
    - chr16
    - chr17
    - chr18
    - chr19
    - chr20
    - chr21
    - chr22
    - chrX
    - chrY

  germline_resource: ""
  contamination_resource: "resources/hg38/small_exac_common_3.hg38.vcf.gz"

  # Panel of Normals (optional — set use: true and provide vcf path)
  pon:
    use: false
    vcf: ""                      # path to pre-built PON VCF

  # Extra GATK flags (appended verbatim)
  mutect2_extra: ""
  filter_extra: "--min-reads-per-strand 1"

# -- Filtering parameters -----------------------------------------------------
filtering:
  # A. gnomAD germline filter
  gnomad:
    snps: "resources/hg38/gnomAD.r2.1.1.AFover0.001.snps.txt.gz"
    af_threshold: 0.001

  # B. VAF filter
  vaf:
    min_alt_count: 5
    p_binom_threshold: 1.0e-6

  # C. PON mask
  pon_mask:
    fasta: "resources/PON.q20q20.05.5.fa"

  # D. 1KG strict mask (mappability)
  mask_1kg: "resources/hg38/1KG.20160622.strict_mask.hg38_GRCh38.fa.gz"

# -- SLURM resource defaults (overridden by profiles/slurm/config.yaml) -------
resources:
  default:
    mem_mb: 8000
    threads: 1
    runtime: 120                 # minutes
