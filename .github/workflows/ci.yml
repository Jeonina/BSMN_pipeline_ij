name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches:
      - refactor/snakemake
      - main

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ruff check
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .

  typecheck:
    name: Typecheck (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Mypy
        run: mypy bsmn_pipeline/

  unit-test:
    name: Unit tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install test extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
      # Coverage threshold is configured in pyproject.toml under
      # [tool.coverage.report].fail_under. The omit list there excludes
      # bio-tool wrapper scripts that cannot be unit-tested without the
      # external toolchain (apptainer/bwa/gatk). See pyproject.toml for
      # the rationale and re-evaluation guidance.
      - name: Pytest
        run: |
          pytest \
            -m "not integration" \
            --cov=bsmn_pipeline \
            --cov=scripts
