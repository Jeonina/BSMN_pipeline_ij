name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches:
      - refactor/snakemake
      - main

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ruff check
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .

  typecheck:
    name: Typecheck (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Mypy
        run: mypy bsmn_pipeline/

  unit-test:
    name: Unit tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install test extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
      # NOTE (M1a): the --cov-fail-under=85 threshold reflects AC-11's
      # repo-wide target and will not pass until M3/M4/M5/M6 land. M1a
      # ships only the validators + scaffolding; this job is allowed to
      # be red on M1a per the spec (`§5 M1a Exit criteria`: "AC-02/AC-03
      # are wired in the CI workflow but may still fail on the broader
      # codebase").
      - name: Pytest
        run: |
          pytest \
            -m "not integration" \
            --cov=bsmn_pipeline \
            --cov=scripts \
            --cov-fail-under=85
