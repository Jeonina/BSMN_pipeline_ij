name: bp
# Slimmed for the Apptainer-based refactor: all pipeline tools now run inside
# Apptainer containers (see config/containers.yaml), so the host conda env only
# needs (1) the Python orchestration/filtering stack and (2) the few bare tools
# that scripts/download_and_index_hg38.sh uses for one-time reference prep.
channels:
  - bioconda
  - conda-forge
  - defaults
dependencies:
  # ── host orchestration + filter glue (run on host Python, NOT in containers) ──
  - python=3
  - snakemake                       # run.py invokes the `snakemake` CLI (was missing)
  - pandas
  - numpy
  - scipy
  - statsmodels
  - pyyaml
  - psutil
  # ── reference-prep tools called bare by scripts/download_and_index_hg38.sh ──
  #    (one-time setup only; the pipeline RUN uses containers for these)
  - bwa                             # bwa index
  - samtools[version='>=1.10']      # samtools faidx / dict, PON assembly
  - gatk4                           # gatk CreateSequenceDictionary (samtools dict is the fallback)
  - hcc::lftp[version='>=4.9.1']    # Broad FTP downloads (ExAC, af-only gnomAD)
  - wget                            # public reference downloads
  - parallel                        # fan-out in setup/worker scripts
